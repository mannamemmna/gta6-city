<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobalt Bay</title>
<style>
  :root {
    --sand: #f2dcc0;
    --deep: #1b2430;
    --accent: #ff9d4d;
    --teal: #2fb8a8;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10151c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; touch-action: none; }
  #hud { z-index: 1; pointer-events: none; }
  .screen {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--sand);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 40%, rgba(18,26,36,0.35), rgba(9,13,19,0.9) 78%);
    -webkit-font-smoothing: antialiased;
  }
  .screen.hidden { display: none; }
  .wordmark { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.16em; }
  #title h1 { font-size: clamp(48px, 11vw, 132px); margin: 0; line-height: 0.92; text-transform: uppercase; font-weight: 400;
    text-shadow: 0 6px 40px rgba(255,120,40,0.35), 0 2px 0 rgba(0,0,0,0.4); }
  #title h1 span { color: var(--accent); }
  #title .tagline { margin: 18px 0 0; font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase; color: #e8cdae; opacity: 0.85; }
  #title .rule { width: 220px; height: 2px; margin: 26px 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  #title .menu { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
  .btn { pointer-events: auto; cursor: pointer; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,190,140,0.28);
    color: var(--sand); padding: 13px 42px; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
  .btn:hover { background: rgba(255,157,77,0.22); border-color: var(--accent); transform: translateY(-1px); }
  .btn.ghost { background: transparent; border-color: rgba(255,255,255,0.14); color: #cfbfae; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 4px 18px; margin-top: 34px; font-size: 12px;
    letter-spacing: 0.08em; color: #cdbba6; opacity: 0.9; }
  .keys b { font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff3e2; font-weight: 600; text-align: right; }
  #pause h2, #dead h2 { font-family: Georgia, serif; font-size: 44px; letter-spacing: 0.2em; margin: 0 0 6px; text-transform: uppercase; }
  #dead h2 { color: #e4584c; }
  #dead .sub { color: #d8c3ab; letter-spacing: 0.2em; font-size: 12px; text-transform: uppercase; margin-bottom: 26px; }
  #missioncard { position: fixed; inset: 0; z-index: 4; display: none; align-items: center; justify-content: flex-start;
    padding-left: 9vw; background: linear-gradient(90deg, rgba(8,12,18,0.86) 0%, rgba(8,12,18,0.5) 42%, transparent 72%); }
  #missioncard .box { max-width: 520px; }
  #missioncard .kicker { color: var(--accent); letter-spacing: 0.34em; font-size: 12px; text-transform: uppercase; }
  #missioncard h3 { font-family: Georgia, serif; font-size: 40px; margin: 10px 0 14px; letter-spacing: 0.02em; }
  #missioncard p { font-size: 16px; line-height: 1.55; color: #ddcbb5; margin: 0 0 10px; }
  #missioncard .who { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); }
  #loading { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    background: #0c1117; color: #d9c6ad; letter-spacing: 0.3em; font-size: 13px; text-transform: uppercase;
    font-family: Helvetica, Arial, sans-serif; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Cobalt Bay, an open world crime game. Explore the city on foot or by car."></canvas>
<canvas id="hud"></canvas>

<div id="loading">building cobalt bay</div>

<div class="screen hidden" id="title">
  <div class="wordmark">
    <h1>COBALT <span>BAY</span></h1>
    <p class="tagline">Salt air · dirty money</p>
  </div>
  <div class="rule"></div>
  <div class="menu">
    <button class="btn" id="btn-new">New Game</button>
    <button class="btn ghost hidden" id="btn-continue">Continue</button>
  </div>
  <div class="keys">
    <b>W A S D</b><span>move · drive</span>
    <b>MOUSE</b><span>look · aim</span>
    <b>LEFT CLICK</b><span>fire</span>
    <b>F</b><span>enter / exit vehicle</span>
    <b>SHIFT</b><span>sprint · handbrake</span>
    <b>SPACE</b><span>jump · brake</span>
    <b>R</b><span>reload</span>
    <b>M</b><span>map · pause</span>
    <b>ESC</b><span>pause</span>
  </div>
</div>

<div class="screen hidden" id="pause">
  <h2>Paused</h2>
  <div class="rule"></div>
  <div class="menu">
    <button class="btn" id="btn-resume">Resume</button>
    <button class="btn ghost" id="btn-save">Save Game</button>
    <button class="btn ghost" id="btn-quit">Quit to Title</button>
  </div>
</div>

<div class="screen hidden" id="dead">
  <h2 id="dead-title">Wasted</h2>
  <div class="sub" id="dead-sub">Cobalt Bay General Hospital · $200 billed</div>
  <button class="btn" id="btn-respawn">Get Up</button>
</div>

<div class="screen hidden" id="missioncard">
  <div class="box">
    <div class="kicker" id="mc-kicker">Mission</div>
    <h3 id="mc-title"></h3>
    <p id="mc-body"></p>
    <div class="who" id="mc-who"></div>
  </div>
</div>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
